name: Release

# 职责：本仓库「独立」发布（人工推 v* / 手动 Run）。
# Core 联动发版走 Sync Core（那边已包含完整 npm + GitHub Release），不依赖本 workflow。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag override (auto = derive from package.json semver)"
        required: false
        default: "auto"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # Sync Core 已在同一次联动里完整发布；若其用 PAT 推 tag 又踢出本 workflow，直接跳过避免重复跑。
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message || '', 'chore: sync @amiriel/core')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Resolve release channel
        id: release
        env:
          NPM_TAG_INPUT: ${{ inputs.npm_tag || 'auto' }}
        run: bash .github/scripts/resolve-release.sh

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="${{ steps.release.outputs.version }}"
          NPM_TAG="${{ steps.release.outputs.npm_tag }}"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance --tag "${NPM_TAG}"

      - name: Ensure tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.release.outputs.version }}"
          PRERELEASE_ARGS=()
          if [ "${{ steps.release.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_ARGS=(--prerelease)
          fi

          # 手动 Run workflow 时可能尚无 tag；tag push 触发时此处为 no-op。
          # 用 GITHUB_TOKEN 补推 tag 不会再次触发本 workflow。
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git config user.name "amirieljs-bot"
            git config user.email "actions@users.noreply.github.com"
            if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
              git tag "${TAG}"
            fi
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" --generate-notes --verify-tag "${PRERELEASE_ARGS[@]}"
          fi
