name: Sync Core

# 职责：Core 联动后的「完整下游发布」——升依赖、对齐版本、打 tag、发 npm、建 GitHub Release。
# 与 Release 任务相同的发布步骤在此独立跑完，不依赖再触发 Release（避免异步竞态）。
# Release workflow 仍留给：人工 push v* tag / 手动 Run（只发本仓、不经过 Core）。

on:
  repository_dispatch:
    types: [core-release]
  workflow_dispatch:
    inputs:
      version:
        description: "@amiriel/core version, with or without leading v"
        required: true
      npm_tag:
        description: "npm dist-tag override (auto = derive from package.json semver)"
        required: false
        default: "auto"

permissions:
  contents: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT 可绕过部分 branch protection；无 PAT 时用 GITHUB_TOKEN。
          # 注意：若用 PAT 推 tag，可能额外触发 Release——两边发布步骤均幂等（已发布则跳过）。
          token: ${{ secrets.AMIRIELJS_SYNC_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve core version
        id: core
        run: |
          VERSION="${{ github.event.client_payload.version || inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "${VERSION}" ]; then
            echo "Missing core version."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update core dependency
        run: |
          npm pkg set "dependencies.@amiriel/core=^${{ steps.core.outputs.version }}"
          pnpm install --no-frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Align package version with core release
        run: |
          # Do not use `pnpm version`: it requires a clean git tree, but
          # `pnpm install` above already dirties pnpm-lock.yaml.
          npm pkg set "version=${{ steps.core.outputs.version }}"

      - name: Resolve release channel
        id: release
        env:
          NPM_TAG_INPUT: ${{ github.event.client_payload.npm_tag || inputs.npm_tag || 'auto' }}
        run: bash .github/scripts/resolve-release.sh

      - name: Commit, tag, and push
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "amirieljs-bot"
          git config user.email "actions@users.noreply.github.com"

          git add package.json pnpm-lock.yaml
          if git diff --staged --quiet; then
            echo "No package.json / lockfile changes to commit."
          else
            git commit -m "chore: sync @amiriel/core to ${{ steps.core.outputs.version }}"
          fi

          git push origin HEAD:main

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already on remote."
          else
            if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
              git tag "${TAG}"
            fi
            git push origin "${TAG}"
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="${{ steps.release.outputs.version }}"
          NPM_TAG="${{ steps.release.outputs.npm_tag }}"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance --tag "${NPM_TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.release.outputs.version }}"
          PRERELEASE_ARGS=()
          if [ "${{ steps.release.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_ARGS=(--prerelease)
          fi
          # tag 已在上一步 push；此处 --verify-tag 一定能通过。
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" --generate-notes --verify-tag "${PRERELEASE_ARGS[@]}"
          fi
